name: Deploy production
on: { push: { branches: [main] } }
permissions: { contents: read }
concurrency: { group: production, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Record D1 recovery bookmark
        run: npx wrangler d1 time-travel info pro-angle-estimates-production --remote
        env: &cf { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - run: npx wrangler d1 migrations apply pro-angle-estimates-production --remote
        env: *cf
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with: { apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}", accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - name: Authenticated smoke test
        run: curl --fail --silent --show-error https://estimates.proangleconstructionpa.com/api/v1/health -H "CF-Access-Client-Id:${{ secrets.SMOKE_ACCESS_CLIENT_ID }}" -H "CF-Access-Client-Secret:${{ secrets.SMOKE_ACCESS_CLIENT_SECRET }}"
